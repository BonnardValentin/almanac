name: release

# Push a tag vX.Y.Z. This builds the binaries, publishes the release, then commits the
# version and checksums the plugin's shim runs to main, so main never points at a release
# that does not exist yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf almanac-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release almanac
      - uses: actions/upload-artifact@v4
        with:
          name: almanac-${{ matrix.target }}
          path: almanac-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
      - name: Pin the version and checksums on main
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "# sha256  asset - written by the release workflow, one line per platform"
            (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |')
          } > plugins/almanac/checksums.txt
          manifest=plugins/almanac/.claude-plugin/plugin.json
          jq --arg v "$version" '.version = $v' "$manifest" > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Pin the almanac $GITHUB_REF_NAME binaries"
          git push origin main
